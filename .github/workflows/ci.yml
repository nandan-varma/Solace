name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  unit-tests:
    name: Build & unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Cache resolved Swift packages
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ hashFiles('Solace.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Resolve a simulator destination
        id: destination
        run: |
          UDID=$(xcodebuild -showdestinations -project Solace.xcodeproj -scheme Solace 2>/dev/null \
            | grep -E "platform:iOS Simulator, .*OS:" \
            | grep -vi ipad \
            | head -1 \
            | sed -E 's/.*id:([0-9A-Fa-f-]+).*/\1/')
          if [ -z "$UDID" ]; then echo "No iOS Simulator destination found" >&2; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project Solace.xcodeproj \
            -scheme Solace \
            -destination "id=${{ steps.destination.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -skipMacroValidation \
            -only-testing:SolaceTests

      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -project Solace.xcodeproj \
            -scheme Solace \
            -destination "id=${{ steps.destination.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -skipMacroValidation \
            -only-testing:SolaceTests

  ui-tests:
    name: UI tests (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Cache resolved Swift packages
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ hashFiles('Solace.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Resolve a simulator destination
        id: destination
        run: |
          UDID=$(xcodebuild -showdestinations -project Solace.xcodeproj -scheme Solace 2>/dev/null \
            | grep -E "platform:iOS Simulator, .*OS:" \
            | grep -vi ipad \
            | head -1 \
            | sed -E 's/.*id:([0-9A-Fa-f-]+).*/\1/')
          if [ -z "$UDID" ]; then echo "No iOS Simulator destination found" >&2; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project Solace.xcodeproj \
            -scheme Solace \
            -destination "id=${{ steps.destination.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -skipMacroValidation \
            -only-testing:SolaceUITests

      - name: Run UI tests
        run: |
          xcodebuild test-without-building \
            -project Solace.xcodeproj \
            -scheme Solace \
            -destination "id=${{ steps.destination.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -skipMacroValidation \
            -only-testing:SolaceUITests
